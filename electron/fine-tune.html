<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a18">
  <title>Fine-tune music analysis · AutoEdit</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8e9df;
      --muted: #9a9f96;
      --quiet: #6f766e;
      --base: #171a18;
      --panel: #202421;
      --line: #373d38;
      --lime: #c9ef74;
      --lime-dim: #9ab84d;
      --coral: #ff806b;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Bahnschrift", "Segoe UI", sans-serif;
      font-family: var(--sans);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--base); color: var(--ink); }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    .app { display: grid; grid-template-rows: 64px 1fr; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--line); background: #1c201d; }
    .brand-mark { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--lime-dim); color: var(--lime); font-size: 13px; transform: rotate(45deg); }
    .brand-mark span { transform: rotate(-45deg); }
    .heading { min-width: 0; }
    .eyebrow { color: var(--quiet); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { overflow: hidden; margin: 3px 0 0; color: var(--ink); font: 18px var(--serif); text-overflow: ellipsis; white-space: nowrap; }
    main { width: min(660px, 100%); margin: 0 auto; padding: 34px 28px; }
    .intro { margin: 0 0 24px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .panel { padding: 20px; border: 1px solid var(--line); background: var(--panel); }
    .panel h2 { margin: 0 0 17px; color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    audio { display: block; width: 100%; margin-bottom: 24px; }
    .field { margin: 0 0 20px; }
    .field label { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .field input, .field select { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 2px; background: #181c19; color: var(--ink); }
    .field input[type="range"] { height: 24px; padding: 0; accent-color: var(--lime); }
    .hint { margin-top: 6px; color: var(--quiet); font-size: 10px; line-height: 1.5; }
    .actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 23px; }
    .button { min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer; font-size: 12px; }
    .button:hover { border-color: var(--muted); background: #2a302b; }
    .button.primary { border-color: var(--lime); background: var(--lime); color: #20251a; font-weight: 700; }
    .button.primary:hover { background: #d8f894; }
    .status { min-height: 18px; margin-top: 12px; color: var(--lime-dim); font-size: 11px; line-height: 1.5; }
    .error { color: var(--coral); }
    @media (max-width: 520px) { main { padding: 22px 14px; } header { padding: 0 14px; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand-mark"><span>A</span></div>
      <div class="heading"><div class="eyebrow">Music analysis</div><h1 id="trackName">Fine-tune analysis</h1></div>
    </header>
    <main>
      <p class="intro">Listen to the track, adjust how AutoEdit finds musical accents, and apply your settings to the assembly.</p>
      <section class="panel" aria-labelledby="settingsHeading">
        <h2 id="settingsHeading">Analysis settings</h2>
        <audio id="audioPreview" controls preload="metadata"></audio>
        <div class="field">
          <label for="cadence">Cut cadence</label>
          <select id="cadence">
            <option value="1">Every beat</option>
            <option value="2">Every 2 beats</option>
            <option value="4">Every bar</option>
          </select>
          <div class="hint">Keeps the strongest accent in each beat group.</div>
        </div>
        <div class="field">
          <label for="sensitivity"><span>Accent sensitivity</span><span id="sensitivityValue">55%</span></label>
          <input id="sensitivity" type="range" min="25" max="85" value="55">
          <div class="hint">Raise sensitivity to include quieter accents; lower it to keep only stronger accents.</div>
        </div>
        <div class="actions">
          <button class="button primary" id="applyButton">Apply &amp; analyze</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const desktopApi = window.autoEditDesktop;
      const params = new URLSearchParams(window.location.search);
      const filePath = params.get('filePath');
      const name = params.get('name') || 'Music track';
      const $ = (id) => document.getElementById(id);
      const sensitivity = $('sensitivity');
      const status = $('status');
      $('trackName').textContent = name;
      $('cadence').value = ['1', '2', '4'].includes(params.get('cadence')) ? params.get('cadence') : '2';
      sensitivity.value = String(Math.max(25, Math.min(85, Number(params.get('sensitivity')) || 55)));
      $('sensitivityValue').textContent = `${sensitivity.value}%`;
      sensitivity.addEventListener('input', () => {
        $('sensitivityValue').textContent = `${sensitivity.value}%`;
      });

      if (!filePath || !desktopApi) {
        status.textContent = 'The music file could not be opened.';
        status.classList.add('error');
        $('applyButton').disabled = true;
        return;
      }
      $('audioPreview').src = desktopApi.pathToFileURL(filePath);
      $('audioPreview').addEventListener('error', () => {
        status.textContent = 'Could not play this track. Check that the source file is still available.';
        status.classList.add('error');
      });
      $('applyButton').addEventListener('click', () => {
        const applied = desktopApi.applyAnalysisSettings({
          sensitivity: Number(sensitivity.value),
          cadence: $('cadence').value
        });
        status.textContent = applied
          ? 'Settings applied. The assembly window is updating the analysis.'
          : 'Could not apply settings. Reopen this window and try again.';
        status.classList.toggle('error', !applied);
      });
    })();
  </script>
</body>
</html>
